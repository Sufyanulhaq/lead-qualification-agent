<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Qualification Agent</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #14181f; --muted: #667085; --line: #e3e6eb;
    --brand: #2f5bea; --brand-ink: #ffffff; --bot: #eef1f6; --hot: #d92d20; --warm: #dc6803; --cold: #475467;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .mode { font-size: 12px; color: var(--muted); border: 1px solid var(--line); background: var(--panel); padding: 4px 10px; border-radius: 999px; }
  main { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; padding: 0 28px 28px; max-width: 1120px; margin: 0 auto; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; height: min(740px, calc(100vh - 100px)); min-height: 520px; overflow-y: auto; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--brand); color: var(--brand-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  form { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  input[type=text]:focus { border-color: var(--brand); }
  button { font: inherit; font-weight: 600; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 0 18px; cursor: pointer; }
  button:disabled, input:disabled { opacity: .5; cursor: default; }
  .card { padding: 6px 20px 20px; }
  .row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .k { color: var(--muted); font-size: 13px; }
  .v { min-height: 22px; }
  .empty { color: #a0a7b4; }
  .chip { display: inline-block; font-size: 12px; background: var(--bot); border-radius: 999px; padding: 2px 10px; margin: 0 6px 4px 0; }
  .result { margin: 4px 20px 20px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: none; }
  .result.show { display: block; }
  .score { display: flex; align-items: center; gap: 14px; }
  .badge { color: #fff; font-weight: 700; padding: 4px 14px; border-radius: 999px; font-size: 14px; }
  .Hot { background: var(--hot); } .Warm { background: var(--warm); } .Cold { background: var(--cold); }
  .num { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .num small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .bar { height: 8px; background: var(--bot); border-radius: 99px; margin: 12px 0; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  ul { margin: 6px 0 0; padding-left: 18px; color: #344054; font-size: 14px; }
  .crm { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .crm b { color: var(--ink); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 0 16px 20px; } header { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Lead Qualification Agent</h1>
  <span class="mode" id="mode">starting</span>
</header>
<main>
  <section class="panel" aria-label="Chat">
    <h2>Website chat</h2>
    <div id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input type="text" id="box" placeholder="Type your reply" maxlength="1000" aria-label="Your message" disabled>
      <button id="send" disabled>Send</button>
    </form>
  </section>
  <section class="panel" aria-label="Lead card">
    <h2>Lead card, filled in as you talk</h2>
    <div class="card">
      <div class="row"><div class="k">Name</div><div class="v" id="f-name"></div></div>
      <div class="row"><div class="k">Company</div><div class="v" id="f-company"></div></div>
      <div class="row"><div class="k">Email</div><div class="v" id="f-email"></div></div>
      <div class="row"><div class="k">Need</div><div class="v" id="f-need"></div></div>
      <div class="row"><div class="k">Services</div><div class="v" id="f-services"></div></div>
      <div class="row"><div class="k">Budget</div><div class="v" id="f-budget"></div></div>
      <div class="row"><div class="k">Timeline</div><div class="v" id="f-timeline"></div></div>
    </div>
    <div class="result" id="result">
      <div class="score"><span class="badge" id="label"></span><span class="num"><span id="total"></span><small> / 100</small></span></div>
      <div class="bar"><i id="fill"></i></div>
      <ul id="reasons"></ul>
      <div class="crm" id="crm"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), box = $("box"), send = $("send");
let session = null;

function add(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function show(id, value) {
  const el = $(id);
  if (value === undefined || value === null || value === "") { el.textContent = "Waiting for an answer"; el.className = "v empty"; }
  else { el.textContent = value; el.className = "v"; }
}
function timeline(c) {
  if (c.timeline_months !== undefined) {
    const m = c.timeline_months;
    if (m <= 0.3) return "As soon as possible";
    if (m < 1) return "About " + Math.max(1, Math.round(m * 30 / 7)) + " weeks";
    return "About " + (Math.round(m * 10) / 10) + (m === 1 ? " month" : " months");
  }
  return c.timeline_unknown ? "No fixed date" : "";
}
function budget(c) {
  if (c.budget_amount !== undefined) return Number(c.budget_amount).toLocaleString("en-GB");
  return c.budget_unknown ? "Not sure yet" : "";
}
function card(c) {
  show("f-name", c.name); show("f-company", c.company); show("f-email", c.email);
  show("f-need", c.need); show("f-budget", budget(c)); show("f-timeline", timeline(c));
  const s = $("f-services");
  s.innerHTML = "";
  if (c.services && c.services.length) { s.className = "v"; c.services.forEach((t) => { const e = document.createElement("span"); e.className = "chip"; e.textContent = t; s.appendChild(e); }); }
  else { s.textContent = "Waiting for an answer"; s.className = "v empty"; }
}
function result(lead) {
  $("label").textContent = lead.label; $("label").className = "badge " + lead.label;
  $("total").textContent = lead.score; $("fill").style.width = lead.score + "%";
  $("reasons").innerHTML = "";
  lead.reasons.forEach((r) => { const li = document.createElement("li"); li.textContent = r; $("reasons").appendChild(li); });
  const ok = lead.crm_status === "sent";
  $("crm").innerHTML = "";
  const b = document.createElement("b"); b.textContent = ok ? "Sent to CRM" : "CRM delivery failed";
  $("crm").append(b, document.createTextNode(" (" + lead.crm_target + ") after " + lead.crm_attempts + (lead.crm_attempts === 1 ? " attempt. " : " attempts. ") + "The lead is saved either way."));
  $("result").className = "result show";
}
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error("request failed");
  return r.json();
}
async function begin() {
  card({});
  try {
    const s = await api("/api/start");
    session = s.session_id;
    $("mode").textContent = s.mode === "claude" ? "Reading replies with Claude" : "Offline mode, no API key";
    add(s.reply, "bot");
    box.disabled = send.disabled = false; box.focus();
  } catch (e) { add("Could not reach the server.", "bot"); }
}
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = box.value.trim();
  if (!text) return;
  box.value = ""; add(text, "me"); box.disabled = send.disabled = true;
  try {
    const r = await api("/api/chat", { session_id: session, message: text });
    add(r.reply, "bot"); card(r.captured);
    if (r.lead) result(r.lead);
    if (!r.done) { box.disabled = send.disabled = false; box.focus(); }
  } catch (err) { add("Something went wrong. Please try again.", "bot"); box.disabled = send.disabled = false; }
});
begin();
</script>
</body>
</html>
